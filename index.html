<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>創藝小玩家・隨選隨做工作坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#1FC9AE; --mint-deep:#0EA491; --mint-pale:#E3FBF3;
  --cream:#FFFBF3; --card:#FFFFFF;
  --pink:#FF6FA1; --pink-deep:#E8477F;
  --blue:#4A5FDB; --blue-deep:#3746B0;
  --orange:#FCA53D; --orange-deep:#E5851A;
  --gold:#FFC93C;
  --ink:#3A342B; --ink-soft:#93897A; --line:#EFE6D8;
  --ok:#1E9E75; --warn:#E0553F;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#EAF6F2}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--cream);color:var(--ink);
  max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:118px;position:relative;
  box-shadow:0 0 40px rgba(15,120,100,.10)}
.kuai{font-family:'ZCOOL KuaiLe','Noto Sans TC',sans-serif}

/* ── 頁首：薄荷綠打洞牆風格 ── */
.hero{
  background:
    radial-gradient(circle,rgba(255,255,255,.16) 1.6px,transparent 1.6px) 0 0/22px 22px,
    linear-gradient(160deg,var(--mint) 0%,var(--mint-deep) 100%);
  color:#fff;padding:22px 20px 26px;position:relative;
  border-radius:0 0 32px 32px;overflow:hidden;
}
.hero .brand{display:flex;align-items:center;gap:8px;font-size:12.5px;opacity:.92;font-weight:700}
.hero .brand .paw{font-size:15px}
.hero h1{font-family:'ZCOOL KuaiLe',sans-serif;font-size:27px;line-height:1.3;margin:10px 0 6px;
  text-shadow:0 2px 0 rgba(0,0,0,.12);letter-spacing:1px}
.hero .sub{font-size:12.5px;opacity:.95;line-height:1.8;background:rgba(255,255,255,.16);
  border-radius:12px;padding:9px 12px;margin-top:4px}
.tagrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.tag{font-family:'ZCOOL KuaiLe',sans-serif;font-size:14px;color:#fff;padding:8px 14px;border-radius:99px;
  box-shadow:0 3px 0 rgba(0,0,0,.14);letter-spacing:.5px}
.tag.t-clay{background:var(--orange)}
.tag.t-cream{background:var(--pink)}
.tag.t-perler{background:var(--blue)}
.mascot{position:absolute;right:14px;top:14px;font-size:34px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.15))}

.steps{display:flex;gap:7px;margin-top:16px}
.steps i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.32);font-style:normal}
.steps i.on{background:var(--gold)}
.stepname{font-size:12.5px;opacity:.92;margin-top:9px;font-weight:700}

/* ── 內容區 ── */
.wrap{padding:18px 16px 8px}
.notice{background:#FFF3D6;border:1.5px solid #F6DD9C;border-radius:16px;padding:13px 15px;margin-bottom:16px;font-size:12.5px;color:#8A6400;line-height:1.75}
.notice b{color:#6B4E00}

/* ── 步驟1：日期與時段 ── */
.weekhead{font-family:'ZCOOL KuaiLe',sans-serif;font-size:14px;color:var(--mint-deep);margin:16px 0 9px 2px}
.monthtabs{display:flex;gap:8px;margin-bottom:14px}
.mtab{flex:0 0 auto;padding:9px 18px;border-radius:99px;border:2px solid var(--line);background:#fff;
  font-family:'ZCOOL KuaiLe',sans-serif;font-size:15px;color:var(--ink-soft)}
.mtab.on{background:var(--mint-deep);border-color:var(--mint-deep);color:#fff}
.contact{margin-top:22px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.ct-row{display:flex;align-items:center;gap:12px}
.ct-row+.ct-row{margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--line)}
.ct-ic{font-size:20px;flex:0 0 auto}
.ct-lb{font-size:11.5px;color:var(--ink-soft)}
.ct-val{font-size:14.5px;font-weight:700;color:var(--mint-deep);text-decoration:none;display:block;margin-top:1px}
.ct-qr{width:56px;height:56px;margin-left:auto;border-radius:8px;border:1.5px solid var(--line);flex:0 0 auto}
.weekhead:first-child{margin-top:0}
.daterow{display:flex;gap:9px;flex-wrap:wrap}
.datechip{flex:0 0 auto;padding:11px 14px;border:2px solid var(--line);border-radius:16px;background:#fff;
  font-family:inherit;font-size:14px;color:var(--ink);text-align:center;min-width:64px;transition:.12s}
.datechip .d{display:block;font-family:'ZCOOL KuaiLe',sans-serif;font-size:19px;color:var(--mint-deep)}
.datechip .w{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
.datechip.on{border-color:var(--mint-deep);background:var(--mint-pale)}
.datechip.on .d{color:var(--mint-deep)}
.datechip.off{opacity:.4}

.slots{margin-top:20px;background:#fff;border:2px solid var(--line);border-radius:20px;padding:16px}
.slots h3{font-family:'ZCOOL KuaiLe',sans-serif;font-size:15.5px;color:var(--mint-deep);margin-bottom:12px}
.slotrow{display:flex;flex-direction:column;gap:10px}
.slot{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border:2px solid var(--line);
  border-radius:16px;background:#fff;font-family:inherit;font-size:15px;transition:.12s}
.slot .left{font-weight:700;color:var(--mint-deep)}
.slot .cap{font-size:12.5px;color:var(--ok);font-weight:500}
.slot .cap.low{color:var(--warn)}
.slot.on{border-color:var(--mint-deep);background:var(--mint-pale)}
.slot:disabled{opacity:.42}

/* ── 步驟2：人數（大人／兒童） ── */
.pbox{background:#fff;border:2px solid var(--line);border-radius:20px;padding:6px 16px}
.prow2{display:flex;align-items:center;justify-content:space-between;padding:15px 0}
.prow2+.prow2{border-top:1.5px dashed var(--line)}
.plabel b{display:block;font-family:'ZCOOL KuaiLe',sans-serif;font-size:16.5px;color:var(--ink)}
.plabel small{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.pstep{display:flex;align-items:center;gap:14px}
.pbtn{width:36px;height:36px;border-radius:50%;border:2px solid var(--mint-deep);background:#fff;
  color:var(--mint-deep);font-size:19px;font-weight:700;font-family:inherit;line-height:1;
  display:flex;align-items:center;justify-content:center}
.pbtn:disabled{border-color:#E0DACE;color:#CFC8BA}
.pnum{min-width:24px;text-align:center;font-family:'ZCOOL KuaiLe',sans-serif;font-size:19px;color:var(--ink)}
.totalbar{margin-top:16px;text-align:center;font-size:13.5px;color:var(--ink-soft);
  background:var(--mint-pale);border-radius:14px;padding:12px}
.totalbar b{color:var(--mint-deep);font-family:'ZCOOL KuaiLe',sans-serif;font-size:16px}

/* ── 步驟3：名冊（姓名＋各自選品項） ── */
.legend{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.lgitem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;
  padding:10px 12px;border-left-width:6px;font-size:12px;color:var(--ink-soft);line-height:1.6}
.lgitem.c-clay{border-left-color:var(--orange)}
.lgitem.c-cream{border-left-color:var(--pink)}
.lgitem.c-perler{border-left-color:var(--blue)}
.lgitem .ic{font-size:20px;flex:0 0 auto}
.lgitem b{color:var(--ink);font-family:'ZCOOL KuaiLe',sans-serif;font-size:14px;font-weight:400}
.lgitem .cnt{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:700}
.lgitem .cnt.full{color:var(--warn)}
.lgitem .cnt.ok{color:var(--ok)}

.rrow{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:11px}
.rrow.done{border-color:#C9EEE3}
.rlabel{font-family:'ZCOOL KuaiLe',sans-serif;font-size:14px;color:var(--mint-deep);margin-bottom:8px}
.rname{width:100%;padding:11px 13px;border:2px solid var(--line);border-radius:12px;font-size:15px;
  font-family:inherit;background:#fff;margin-bottom:10px}
.rname:focus{outline:none;border-color:var(--mint-deep)}
.ritems{display:flex;gap:7px;flex-wrap:wrap}
.richip{flex:1;min-width:88px;padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:#fff;
  font-family:inherit;font-size:13px;color:var(--ink);text-align:center;font-weight:700}
.richip.c-clay.on{background:var(--orange);border-color:var(--orange-deep);color:#fff}
.richip.c-cream.on{background:var(--pink);border-color:var(--pink-deep);color:#fff}
.richip.c-perler.on{background:var(--blue);border-color:var(--blue-deep);color:#fff}
.richip:disabled{opacity:.4}

/* ── 步驟4：聯絡資料 ── */
.recap{background:var(--mint-pale);border:2px solid #C9EEE3;border-radius:18px;padding:15px;font-size:13.5px;line-height:1.9;margin-bottom:16px}
.recap b{color:var(--mint-deep)}
.recap .rline{display:block}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:700}
.field input,.field textarea{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:14px;
  font-size:15px;font-family:inherit;background:#fff}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--mint-deep)}

/* ── 完成畫面 ── */
.done{padding:52px 26px;text-align:center}
.done .big{font-size:50px}
.done h2{font-family:'ZCOOL KuaiLe',sans-serif;font-size:22px;color:var(--mint-deep);margin:12px 0 8px}
.done p{font-size:14px;color:var(--ink-soft);line-height:1.85}
.done .items{margin-top:12px;font-size:13.5px;color:var(--ink);text-align:left;background:var(--mint-pale);
  border-radius:16px;padding:14px 16px;line-height:2}

.state{padding:48px 24px;text-align:center;color:var(--ink-soft);font-size:14px;line-height:1.7}

/* ── 底部列 ── */
.bar{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:0;z-index:30;
  background:#fff;border-top:2px solid var(--line);padding:13px 16px calc(13px + env(safe-area-inset-bottom));
  border-radius:20px 20px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.05)}
.bar .sum{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink-soft);margin-bottom:10px}
.bar .sum b{color:var(--mint-deep);font-size:15px}
.bar .sum .clear{color:var(--ink-soft);text-decoration:underline;background:none;border:none;font-size:13px;font-family:inherit}
.btnrow{display:flex;gap:10px}
.back{flex:0 0 52px;border:2px solid var(--mint-deep);background:#fff;color:var(--mint-deep);border-radius:14px;font-size:18px}
.next{flex:1;padding:15px;border:none;border-radius:14px;background:var(--mint-deep);color:#fff;
  font-size:16.5px;font-weight:700;letter-spacing:2px;font-family:inherit;box-shadow:0 4px 0 #0B7E70}
.next:disabled{background:#C7CBC4;box-shadow:none}

/* ── 選時段後的提示視窗 ── */
.modalOverlay{display:none;position:fixed;inset:0;background:rgba(26,40,36,.55);z-index:100;
  align-items:center;justify-content:center;padding:24px}
.noticeCard{background:#fff;border-radius:24px;padding:26px 22px 22px;max-width:340px;width:100%;
  text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.2)}
.noticeIcon{font-size:40px;margin-bottom:8px}
.noticeCard h3{font-family:'ZCOOL KuaiLe',sans-serif;font-size:19px;color:var(--mint-deep);margin-bottom:10px}
.noticeCard p{font-size:14px;color:var(--ink);line-height:1.85;margin-bottom:18px}
.noticeCard p b{color:var(--mint-deep)}
.noticeCard button{width:100%;padding:13px;border:none;border-radius:14px;background:var(--mint-deep);color:#fff;
  font-size:15px;font-weight:700;font-family:inherit;box-shadow:0 4px 0 #0B7E70}
</style>
</head>
<body>
<div class="hero">
  <span class="mascot">🐻</span>
  <div class="brand"><span class="paw">🐾</span>Otto2 台中旗艦店</div>
  <h1>創藝小玩家<br>隨選隨做工作坊</h1>
  <div class="sub">活動日期｜8/17–8/21、8/24–8/28（週一至週五）<br>開放時段｜下午 2:00–6:00・晚上 7:00–9:00（實際時段依當日開放為準）</div>
  <div class="tagrow">
    <span class="tag t-clay">黏土創作</span>
    <span class="tag t-cream">奶油膠DIY</span>
    <span class="tag t-perler">迷你拼豆</span>
  </div>
  <div class="steps"><i id="st1"></i><i id="st2"></i><i id="st3"></i><i id="st4"></i></div>
  <div class="stepname" id="stepname"></div>
</div>

<div id="view"></div>

<div class="bar" id="bar">
  <div class="sum">
    <span>已完成 <b id="sumItems">0</b>／<b id="sumPeople">0</b> 位</span>
    <button class="clear" id="btnClear">清空</button>
  </div>
  <div class="btnrow">
    <button class="back" id="btnBack" style="display:none">←</button>
    <button class="next" id="btnNext">下一步 →</button>
  </div>
</div>

<div class="modalOverlay" id="noticeModal">
  <div class="noticeCard">
    <div class="noticeIcon">🐻⏰</div>
    <h3>貼心小提醒</h3>
    <p>您預約的是<b>「課程開始」</b>的時間喔！<br>實際完成作品所需的時間，會依照當天挑戰的<b>作品難易度</b>略有不同，請保留充裕時間慢慢創作 😊</p>
    <button id="noticeOk">我知道了</button>
  </div>
</div>

/* ══════════════════ 設定區（活動結束或改期時改這裡就好） ══════════════════ */

/* 預設開課日期（保底清單，後台還沒新增任何日期時會先用這份）。
   之後日期要新增/關閉，直接在後台「課程日期管理」操作，不用改這裡；
   後台加過的日期會跟這份保底清單合併。 */
function buildDates(ranges){
  const out=[];
  ranges.forEach(([y,m,from,to])=>{
    for(let d=from;d<=to;d++) out.push(`${y}/${String(m).padStart(2,"0")}/${String(d).padStart(2,"0")}`);
  });
  return out;
}

    tiers:[ {name:"入門款式", stars:null}, {name:"進階款式", stars:null}, {name:"精緻款式", stars:null} ] },
  { id:"perler", name:"拼豆",   icon:"🔵", cap:8, colorCls:"c-perler",
    ageNote:"國小一年級以上可獨立製作；未滿小一需大人陪同",
    tiers:[ {name:"入門款式", stars:null}, {name:"進階款式", stars:null}, {name:"精緻款式", stars:null} ] }
];

/* ══════════════════ 狀態 ══════════════════ */
let step=1;                 // 1=日期時段 2=人數 3=名冊(姓名+品項) 4=聯絡資料
let selDate="", selSlot="";
let adults=0, kids=0;         // 登記時分開記，方便老師看表單
let roster=[];                // [{role:'adult'|'kid', name:'', itemId:null}, ...] 一人一列
let customer={name:"",phone:"",note:""};
let bookedMap={};             // "date|slot|itemId" -> 已預約人數（從資料庫算出的）

/* ══════════════════ 小工具 ══════════════════ */
const pad=n=>String(n).padStart(2,"0");
const dstr=(y,m,d)=>`${y}/${pad(m)}/${pad(d)}`;
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function weekdayOf(dateStr){
  const [y,m,d]=dateStr.split("/").map(Number);
  return ["日","一","二","三","四","五","六"][new Date(y,m-1,d).getDay()];
}
function slotPassed(date,slot){
  const now=new Date();
  const today=dstr(now.getFullYear(),now.getMonth()+1,now.getDate());
  if(date<today)return true;
  if(date>today)return false;
  const m=slot.match(/^(\d{1,2}):(\d{2})/);
  if(!m)return false;
  return now.getHours()*60+now.getMinutes() >= (+m[1])*60+(+m[2]);
}
function slotStartDate(date,slot){
  const [y,m,d]=date.split("/").map(Number);
  const mm=slot.match(/^(\d{1,2}):(\d{2})/);
  return new Date(y,m-1,d,+mm[1],+mm[2]);
}
/* 還沒開始，但已經在「開課前 CUTOFF_HOURS 小時」的截止線之內，不能線上約 */
function slotTooSoon(date,slot){
  const start=slotStartDate(date,slot);
  const now=new Date();
  if(start<=now)return false;
  return (start-now) < CUTOFF_HOURS*3600*1000;
}
/* 這個時段目前是否還能線上預約（有開放、沒過期、沒在截止線內、至少一個品項有名額） */
function slotBookable(date,slot){
  return effectiveSlots(date).includes(slot) && !slotPassed(date,slot) && !slotTooSoon(date,slot) && slotHasRoom(date,slot);
}
function itemOf(id){ return ITEMS.find(i=>i.id===id); }
function partyNeed(){ return adults+kids; }

/* ══════════════════ 資料存取（demo：localStorage／正式：Firebase） ══════════════════ */
const LS_KEY="otto2_popup_bookings_v1";
function demoLoad(){ try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]")}catch(e){return []} }
function demoSave(list){ try{localStorage.setItem(LS_KEY,JSON.stringify(list))}catch(e){} }

async function loadBookings(){
  bookedMap={};
  let list=[];
  if(FIREBASE_URL){
    try{
      const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupBookings.json");
      const j=await res.json();
      list=j?Object.values(j):[];
    }catch(e){ list=[]; }
  }else{
    list=demoLoad();
  }
  list.forEach(b=>{
    if(!b||b.status==="cancelled"||!b.date||!b.slot||!Array.isArray(b.items))return;
    b.items.forEach(it=>{
      if(!it||!it.itemId)return;
      const k=b.date+"|"+b.slot+"|"+it.itemId;
      bookedMap[k]=(bookedMap[k]||0)+(+it.qty||1);
    });
  });
}
/* 資料庫裡已經確定的名額（不含這次還沒送出的名冊） */
function dbLeft(date,slot,itemId){
  const it=itemOf(itemId);
  if(!it)return 0;
  const used=bookedMap[date+"|"+slot+"|"+itemId]||0;
  return Math.max(0,it.cap-used);
}
/* 這個時段是否還有任何品項剩名額（給日曆時段列表判斷要不要整格關掉） */
function slotHasRoom(date,slot){
  return ITEMS.some(it=>dbLeft(date,slot,it.id)>0);
}
/* 名冊裡（還沒送出前）已經有幾個人選了這個品項 */
function rosterCount(itemId,excludeIdx){
  return roster.reduce((s,r,i)=> s+((i!==excludeIdx&&r.itemId===itemId)?1:0),0);
}
/* 這個品項在目前名冊狀態下，還可以再選幾位（扣掉自己這格） */
function availableFor(itemId,excludeIdx){
  return dbLeft(selDate,selSlot,itemId) - rosterCount(itemId,excludeIdx);
}

/* 讀取後台「課程日期管理」新增/調整過的日期與時段，跟保底清單合併。
   SCHEDULE_MAP 的值可能是：陣列＝該日開放的時段清單；true＝全部時段開放；false／不存在＝用保底清單。 */
let SCHEDULE_MAP={};
async function loadSchedule(){
  SCHEDULE_MAP={};
  if(FIREBASE_URL){
    try{
      const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupSchedule.json");
      if(res.ok){
        const raw=(await res.json())||{};
        // Firebase 的 key 不能有斜線，後台存的時候用 2026-08-17 這種格式，這裡轉回 2026/08/17
        Object.keys(raw).forEach(k=>{ SCHEDULE_MAP[k.replace(/-/g,"/")]=raw[k]; });
      }
    }catch(e){ SCHEDULE_MAP={}; }
  }
  const set=new Set(DEFAULT_DATES.concat(Object.keys(SCHEDULE_MAP)));
  OPEN_DATES=Array.from(set).filter(d=>effectiveSlots(d).length>0).sort();
}
/* 這個日期實際開放的時段陣列 */
function effectiveSlots(date){
  if(Object.prototype.hasOwnProperty.call(SCHEDULE_MAP,date)){
    const v=SCHEDULE_MAP[date];
    if(v===true)return SLOTS.slice();
    if(v===false)return [];
    if(Array.isArray(v))return v.filter(s=>SLOTS.includes(s));
    return [];
  }
  return DEFAULT_DATES.includes(date)?DEFAULT_SLOTS.slice():[];
}
function monthKeyOf(dateStr){ return dateStr.slice(0,7); } // "2026/08"
function monthLabelOf(key){ return +key.slice(5,7)+"月"; }
function groupByMonth(dates){
  const map={};
  dates.forEach(d=>{ const k=monthKeyOf(d); (map[k]=map[k]||[]).push(d); });
  return map;
}

/* ══════════════════ 畫面骨架 ══════════════════ */
function syncChrome(){
  for(let i=1;i<=4;i++)document.getElementById("st"+i).className=(i<=step)?"on":"";
  document.getElementById("stepname").textContent=
    ["","步驟 1／4：選擇日期與時段","步驟 2／4：登記人數","步驟 3／4：登記姓名與品項","步驟 4／4：確認與聯絡資料"][step];
  document.getElementById("btnBack").style.display=(step>1)?"block":"none";
}
function setStep(n){ step=n; syncChrome(); render(); }
function render(){
  syncChrome();
  if(step===1)renderDateSlot();
  if(step===2)renderParty();
  if(step===3)renderRoster();
  if(step===4)renderContact();
  updateBar();
}
function rosterDoneCount(){ return roster.filter(r=>r.name.trim()&&r.itemId).length; }
function updateBar(){
  document.getElementById("sumItems").textContent=rosterDoneCount();
  document.getElementById("sumPeople").textContent=roster.length||partyNeed();
  const btn=document.getElementById("btnNext");
  if(step===1){
    btn.textContent="登記人數 →";
    btn.disabled=!(selDate&&selSlot);
  }
  if(step===2){
    const need=partyNeed();
    btn.textContent=need===0?"請至少選擇 1 位":"登記姓名與品項 →";
    btn.disabled=need===0;
  }
  if(step===3){
    const total=roster.length, done=rosterDoneCount();
    btn.textContent=done<total?`還有 ${total-done} 位未填完 →`:"填寫聯絡資料 →";
    btn.disabled=done<total;
  }
  if(step===4){
    btn.textContent="送出預約";
    btn.disabled=!(customer.name.trim()&&customer.phone.trim());
  }
}

/* ══════════════════ 步驟 1：日期與時段 ══════════════════ */
let selMonth="";
function defaultMonth(){
  const today=(()=>{const n=new Date();return dstr(n.getFullYear(),n.getMonth()+1,n.getDate());})();
  const future=OPEN_DATES.filter(d=>d>=today);
  return monthKeyOf((future[0]||OPEN_DATES[0]||today));
}
function contactCard(){
  return `<div class="contact">
    <div class="ct-row">
      <span class="ct-ic">📞</span>
      <div><div class="ct-lb">教室電話</div><a class="ct-val" href="tel:${CONTACT_PHONE_TEL}">${CONTACT_PHONE}</a></div>
    </div>
    <div class="ct-row">
      <span class="ct-ic">💬</span>
      <div><div class="ct-lb">加 LINE 詢問老師</div><div class="ct-val">掃描右側 QR code</div></div>
      <img class="ct-qr" src="${LINE_QR_DATAURI}" alt="LINE QR code">
    </div>
  </div>`;
}
function renderDateSlot(){
  if(!selMonth||!OPEN_DATES.some(d=>monthKeyOf(d)===selMonth))selMonth=defaultMonth();
  const byMonth=groupByMonth(OPEN_DATES);
  const months=Object.keys(byMonth).sort();
  const monthTabs=months.map(mk=>
    `<button class="mtab ${mk===selMonth?'on':''}" data-m="${mk}">${monthLabelOf(mk)}</button>`).join("");
  const datesInMonth=byMonth[selMonth]||[];
  const chip=d=>{
    const noneBookable=SLOTS.every(s=>!slotBookable(d,s));
    const off=noneBookable;
    return `<button class="datechip ${d===selDate?'on':''} ${off?'off':''}" data-d="${d}" ${off?'disabled':''}>
      <span class="d">${+d.split("/")[2]}</span><span class="w">週${weekdayOf(d)}</span></button>`;
  };
  let slotHtml="";
  if(selDate){
    const daySlots=effectiveSlots(selDate);
    slotHtml=`<div class="slots"><h3>${selDate}（週${weekdayOf(selDate)}）可預約時段</h3><div class="slotrow">
      ${(daySlots.length?daySlots:SLOTS).map(s=>{
        const passed=slotPassed(selDate,s);
        const tooSoon=!passed&&slotTooSoon(selDate,s);
        const room=slotHasRoom(selDate,s);
        const bookable=slotBookable(selDate,s);
        const minLeft=Math.min(...ITEMS.map(it=>dbLeft(selDate,s,it.id)));
        let capText;
        if(!daySlots.includes(s))capText="本時段未開放";
        else if(passed)capText="已過時間";
        else if(tooSoon)capText=CUTOFF_MSG;
        else if(!room)capText="三品項皆已額滿";
        else capText=`各品項尚有名額`;
        return `<button class="slot ${s===selSlot?'on':''}" data-s="${s}" ${!bookable?'disabled':''}>
          <span class="left">${s}</span>
          <span class="cap ${tooSoon?'low':(!passed&&room&&minLeft<=2?'low':'')}">${capText}</span></button>`;
      }).join("")}
    </div></div>`;
  }
  document.getElementById("view").innerHTML=`<div class="wrap">
    <div class="notice"><b>💰 費用說明</b>　無需線上付款，作品費用由現場依難易度／款式以星星折抵。<br><b>⏰ 預約時限</b>　開課前 ${CUTOFF_HOURS} 小時內請直接電洽或私訊老師，恕無法線上預約。</div>
    <div class="monthtabs">${monthTabs}</div>
    <div class="daterow">${datesInMonth.map(chip).join("")||'<div class="state">這個月還沒有開放的日期。</div>'}</div>
    ${slotHtml}
    ${contactCard()}
  </div>`;
  document.querySelectorAll(".mtab").forEach(b=>b.onclick=()=>{
    selMonth=b.dataset.m; selDate=""; selSlot=""; roster=[]; render();
  });
  document.querySelectorAll(".datechip:not(.off)").forEach(b=>b.onclick=async()=>{
    selDate=b.dataset.d; selSlot=""; roster=[];
    await loadBookings(); render();
  });
  document.querySelectorAll(".slot:not(:disabled)").forEach(b=>b.onclick=()=>{
    selSlot=b.dataset.s; roster=[]; render();
    document.getElementById("noticeModal").style.display="flex";
  });
}

/* ══════════════════ 步驟 2：人數（大人／兒童） ══════════════════ */
function renderParty(){
  const total=adults+kids;
  document.getElementById("view").innerHTML=`<div class="wrap">
    <div class="notice"><b>${selDate}（週${weekdayOf(selDate)}）　${selSlot}</b><br>大人和兒童分開登記，方便老師安排陪同與座位；下一步會請你填每一位的姓名。</div>
    <div class="pbox">
      <div class="prow2">
        <span class="plabel"><b>👨‍👩‍👧 大人</b><small>16 歲以上</small></span>
        <span class="pstep">
          <button class="pbtn" data-p="a-" ${adults<=0?'disabled':''}>−</button>
          <span class="pnum">${adults}</span>
          <button class="pbtn" data-p="a+" ${total>=12?'disabled':''}>＋</button>
        </span>
      </div>
      <div class="prow2">
        <span class="plabel"><b>🧒 兒童</b><small>依品項各有年齡建議，詳見下一步</small></span>
        <span class="pstep">
          <button class="pbtn" data-p="k-" ${kids<=0?'disabled':''}>−</button>
          <span class="pnum">${kids}</span>
          <button class="pbtn" data-p="k+" ${total>=12?'disabled':''}>＋</button>
        </span>
      </div>
    </div>
    <div class="totalbar">本次共 <b>${total} 位</b>（大人 ${adults}・兒童 ${kids}），下一步請填每位的姓名並各自選品項</div>
  </div>`;
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.p, total=adults+kids;
    if(k==="a+"&&total<12)adults++;
    if(k==="a-"&&adults>0)adults--;
    if(k==="k+"&&total<12)kids++;
    if(k==="k-"&&kids>0)kids--;
    roster=[]; render();
  });
}

/* ══════════════════ 步驟 3：名冊（姓名＋各自選品項） ══════════════════ */
function ensureRoster(){
  const total=adults+kids;
  if(roster.length!==total){
    const fresh=[];
    for(let i=0;i<adults;i++)fresh.push({role:"adult",name:"",itemId:null});
    for(let i=0;i<kids;i++)fresh.push({role:"kid",name:"",itemId:null});
    roster=fresh;
  }
}
function roleLabel(idx){
  const r=roster[idx];
  const sameBefore=roster.slice(0,idx).filter(x=>x.role===r.role).length;
  return (r.role==="adult"?"大人":"兒童")+" "+(sameBefore+1);
}
function renderRoster(){
  ensureRoster();
  const legend=ITEMS.map(it=>{
    const left=dbLeft(selDate,selSlot,it.id)-rosterCount(it.id,-1);
    const full=left<=0;
    return `<div class="lgitem ${it.colorCls}">
      <span class="ic">${it.icon}</span>
      <span><b>${it.name}</b>　${it.ageNote}</span>
      <span class="cnt ${full?'full':'ok'}">${full?'已滿':'剩 '+left}</span>
    </div>`;
  }).join("");
  const rows=roster.map((r,i)=>{
    return `<div class="rrow ${r.name.trim()&&r.itemId?'done':''}">
      <div class="rlabel">${roleLabel(i)}</div>
      <input class="rname" data-i="${i}" value="${esc(r.name)}" placeholder="請輸入姓名，例如：王小明">
      <div class="ritems">
        ${ITEMS.map(it=>{
          const avail=availableFor(it.id,i);
          const selected=r.itemId===it.id;
          const dis=!selected&&avail<=0;
          return `<button class="richip ${it.colorCls} ${selected?'on':''}" data-i="${i}" data-item="${it.id}" ${dis?'disabled':''}>${it.icon} ${it.name}</button>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");
  document.getElementById("view").innerHTML=`<div class="wrap">
    <div class="notice"><b>${selDate}（週${weekdayOf(selDate)}）　${selSlot}</b><br>請填每一位的姓名，並各自選一個品項（可以做不同品項）。</div>
    <div class="legend">${legend}</div>
    ${rows}
  </div>`;
  document.querySelectorAll(".rname").forEach(inp=>inp.oninput=()=>{
    roster[+inp.dataset.i].name=inp.value;
    updateBar();
    const row=inp.closest(".rrow");
    if(row)row.classList.toggle("done", !!(roster[+inp.dataset.i].name.trim()&&roster[+inp.dataset.i].itemId));
  });
  document.querySelectorAll(".richip").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i, id=b.dataset.item;
    roster[i].itemId = roster[i].itemId===id ? null : id;
    render();
    /* 保留使用者剛剛打字打到一半的游標焦點體驗：重繪後把焦點放回同一列的姓名欄 */
    const again=document.querySelector('.rname[data-i="'+i+'"]');
    if(again){ again.focus(); const v=again.value; again.value=""; again.value=v; }
  });
}

/* ══════════════════ 步驟 4：聯絡資料 ══════════════════ */
function renderContact(){
  const rosterLines=roster.map(r=>
    `<span class="rline">${esc(r.name)}　${itemOf(r.itemId).icon} ${itemOf(r.itemId).name}</span>`).join("");
  document.getElementById("view").innerHTML=`<div class="wrap">
    <div class="recap"><b>${selDate}（週${weekdayOf(selDate)}）　${selSlot}</b><br>
      大人 ${adults} 位・兒童 ${kids} 位<br>${rosterLines}</div>
    <div class="field"><label>聯絡人姓名 *</label><input id="fName" value="${esc(customer.name)}" placeholder="請填寫聯絡人姓名"></div>
    <div class="field"><label>手機 *</label><input id="fPhone" value="${esc(customer.phone)}" inputmode="tel" placeholder="09xx-xxx-xxx"></div>
    <div class="field"><label>備註</label><textarea id="fNote" rows="3" placeholder="特殊需求等">${esc(customer.note)}</textarea></div>
  </div>`;
  ["fName","fPhone","fNote"].forEach(id=>{
    document.getElementById(id).oninput=()=>{
      customer={
        name:document.getElementById("fName").value,
        phone:document.getElementById("fPhone").value,
        note:document.getElementById("fNote").value
      };
      updateBar();
    };
  });
}

/* ══════════════════ 送出 ══════════════════ */
async function submitBooking(){
  await loadBookings();
  const need={};
  roster.forEach(r=>{ need[r.itemId]=(need[r.itemId]||0)+1; });
  for(const id in need){
    if(need[id]>dbLeft(selDate,selSlot,id)){
      alert(itemOf(id).name+" 名額剛被約走，請重新選擇。");
      setStep(3); return;
    }
  }
  const rec={
    date:selDate, slot:selSlot,
    adults, kids, party:{adults,kids,label:`大人 ${adults} 位・兒童 ${kids} 位`},
    items:roster.map(r=>({itemId:r.itemId,name:itemOf(r.itemId).name,person:r.name.trim(),role:r.role,qty:1})),
    people:roster.length,
    customer:{...customer},
    source:"popup-web", status:"new", ts:new Date().toISOString()
  };
  let id="POP-"+Math.random().toString(36).slice(2,7).toUpperCase();
  if(FIREBASE_URL){
    try{
      const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupBookings.json",{
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(rec)});
      const j=await res.json();
      if(j&&j.name)id=j.name.slice(-6).toUpperCase();
    }catch(e){
      const list=demoLoad(); rec.id=id; list.push(rec); demoSave(list);
    }
  }else{
    const list=demoLoad(); rec.id=id; list.push(rec); demoSave(list);
  }
  renderDone(id,rec);
}
function renderDone(id,rec){
  document.getElementById("bar").style.display="none";
  document.getElementById("view").innerHTML=`<div class="done">
    <div class="big">🐻✨</div><h2>預約完成！</h2>
    <p><b>${rec.date}（週${weekdayOf(rec.date)}）　${rec.slot}</b><br>編號：${id}</p>
    <div class="items">大人 ${rec.adults} 位・兒童 ${rec.kids} 位<br>
      ${rec.items.map(it=>`${it.person}　${it.name}`).join("<br>")}</div>
    <p style="margin-top:14px">請提前 5-10 分鐘到櫃檯報到，作品費用現場依難易度／款式以星星折抵。</p>
  </div>`;
}

/* ══════════════════ 啟動 ══════════════════ */
document.getElementById("btnClear").onclick=()=>{ selDate=""; selSlot=""; adults=0; kids=0; roster=[]; setStep(1); };
document.getElementById("btnBack").onclick=()=>setStep(step-1);
document.getElementById("btnNext").onclick=async()=>{
  if(step===1)setStep(2);
  else if(step===2)setStep(3);
  else if(step===3)setStep(4);
  else if(step===4){ document.getElementById("btnNext").disabled=true; await submitBooking(); }
};
document.getElementById("noticeOk").onclick=()=>{ document.getElementById("noticeModal").style.display="none"; };
(async function boot(){
  await loadSchedule();
  await loadBookings();
  render();
})();
</script>
</body>
