<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>櫃檯後台・創藝小玩家預約總覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#1FC9AE; --mint-deep:#0EA491; --mint-pale:#E3FBF3;
  --cream:#FAF9F4; --card:#FFFFFF;
  --pink:#FF6FA1; --blue:#4A5FDB; --orange:#FCA53D;
  --ink:#33302B; --ink-soft:#8A8272; --line:#E7E0D2;
  --ok:#1E9E75; --warn:#E0553F; --gold:#C88A00;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:40px}
.kuai{font-family:'ZCOOL KuaiLe',sans-serif}

.hero{background:linear-gradient(135deg,var(--mint),var(--mint-deep));color:#fff;padding:18px 20px 20px;
  position:sticky;top:0;z-index:20;box-shadow:0 3px 10px rgba(0,0,0,.08)}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero h1{font-family:'ZCOOL KuaiLe',sans-serif;font-size:19px}
.hero .meta{font-size:12px;opacity:.9;margin-top:2px}
.refreshBtn{background:rgba(255,255,255,.22);border:none;color:#fff;padding:8px 14px;border-radius:10px;
  font-size:13px;font-family:inherit;font-weight:700;white-space:nowrap}
.refreshBtn:active{background:rgba(255,255,255,.34)}

.viewtabs{display:flex;gap:8px;margin-top:14px}
.vtab{flex:1;padding:9px;border-radius:10px;border:1.5px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:13px;font-weight:700}
.vtab.on{background:#fff;color:var(--mint-deep);border-color:#fff}

.schedwrap{max-width:520px;margin:0 auto;padding:16px}
.schedadd{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.schedadd input[type=date]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-size:14px;font-family:inherit;margin-bottom:10px}
.schedaddslots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.slotchk{display:flex;align-items:center;gap:5px;font-size:12.5px;background:#F7F5EC;border-radius:8px;padding:6px 10px}
.schedadd button{width:100%;padding:11px 16px;border:none;border-radius:10px;background:var(--mint-deep);color:#fff;
  font-size:13.5px;font-weight:700;font-family:inherit}
.schedmonth{font-family:'ZCOOL KuaiLe',sans-serif;font-size:15px;color:var(--mint-deep);margin:16px 0 8px}
.schedmonth:first-child{margin-top:0}
.schedrow{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
.schedrow.past{opacity:.55}
.schedrowhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.schedrow .d{font-weight:700}
.schedrow .d small{color:var(--ink-soft);font-weight:400;margin-left:6px}
.schedcount{font-size:11.5px;color:var(--ink-soft)}
.schedslots{display:flex;gap:7px;flex-wrap:wrap}
.slotToggle{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);padding:6px 12px;
  border-radius:9px;font-size:12px;font-weight:700;font-family:inherit}
.slotToggle.on{background:var(--mint-deep);border-color:var(--mint-deep);color:#fff}

.datetabs{display:flex;gap:7px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.datetabs::-webkit-scrollbar{display:none}
.dtab{flex:0 0 auto;padding:8px 12px;border-radius:11px;border:1.5px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:13px;text-align:center}
.dtab b{display:block;font-family:'ZCOOL KuaiLe',sans-serif;font-size:15px}
.dtab.on{background:#fff;color:var(--mint-deep);border-color:#fff}
.dtab.on b{color:var(--mint-deep)}

.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow input{flex:1;padding:9px 12px;border-radius:10px;border:none;font-size:13.5px;font-family:inherit}
.togBtn{padding:9px 13px;border-radius:10px;border:1.5px solid rgba(255,255,255,.5);background:rgba(255,255,255,.1);
  color:#fff;font-size:12.5px;font-family:inherit;white-space:nowrap}
.togBtn.on{background:#fff;color:var(--mint-deep)}

.wrap{padding:16px 16px 8px;max-width:720px;margin:0 auto}

.sumrow{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.sumcard{flex:1;min-width:130px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px}
.sumcard .n{font-family:'ZCOOL KuaiLe',sans-serif;font-size:22px;color:var(--mint-deep)}
.sumcard .lb{font-size:11.5px;color:var(--ink-soft);margin-top:2px}

.slotsec{margin-bottom:20px}
.slotsec h2{font-family:'ZCOOL KuaiLe',sans-serif;font-size:15.5px;color:var(--ink);margin-bottom:9px;
  display:flex;align-items:center;gap:8px}
.slotsec h2 .cnt{font-size:11.5px;color:var(--ink-soft);font-family:'Noto Sans TC',sans-serif;font-weight:400}

.capbars{display:flex;gap:8px;margin-bottom:10px}
.capbar{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;border-left-width:5px}
.capbar.c-clay{border-left-color:var(--orange)}
.capbar.c-cream{border-left-color:var(--pink)}
.capbar.c-perler{border-left-color:var(--blue)}
.capbar .nm{font-size:12px;color:var(--ink-soft)}
.capbar .val{font-family:'ZCOOL KuaiLe',sans-serif;font-size:16px;margin-top:1px}
.capbar .val.full{color:var(--warn)}
.capbar .val.ok{color:var(--ok)}
.capbar .bar{height:5px;border-radius:99px;background:#EFE9DC;margin-top:6px;overflow:hidden}
.capbar .bar i{display:block;height:100%;background:var(--mint-deep);border-radius:99px}
.capbar.c-clay .bar i{background:var(--orange)}
.capbar.c-cream .bar i{background:var(--pink)}
.capbar.c-perler .bar i{background:var(--blue)}

.bkrow{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:9px;
  border-left-width:5px}
.bkrow.st-cancelled{opacity:.5;border-left-color:#CFC8BA!important}
.bkhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bkname{font-size:15px;font-weight:700}
.bkname a{color:inherit;text-decoration:none;border-bottom:1px dashed var(--ink-soft)}
.bkparty{font-size:12px;color:var(--ink-soft);margin-top:2px}
.bkitems{font-size:12.5px;color:var(--ink);margin-top:7px;line-height:1.7}
.bknote{font-size:12px;color:var(--ink-soft);margin-top:6px;background:#F7F5EC;border-radius:8px;padding:6px 9px}
.bkfoot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.bkts{font-size:10.5px;color:#B4AC9C}
.cancelBtn{border:1.5px solid var(--warn);background:#fff;color:var(--warn);font-size:11.5px;padding:5px 10px;
  border-radius:8px;font-family:inherit}
.restoreBtn{border:1.5px solid var(--ok);background:#fff;color:var(--ok);font-size:11.5px;padding:5px 10px;
  border-radius:8px;font-family:inherit}
.badge-cancel{font-size:10.5px;color:var(--warn);font-weight:700;background:#FBE7E2;padding:2px 8px;border-radius:99px}
.badge-attended{font-size:10.5px;color:var(--ok);font-weight:700;background:#DFF5EC;padding:2px 8px;border-radius:99px}
.bkrow.st-attended{background:#FAFEFC;border-color:#CDEDE0}
.bkbtns{display:flex;gap:7px}
.attendBtn{border:1.5px solid var(--ok);background:#fff;color:var(--ok);font-size:11.5px;padding:5px 10px;
  border-radius:8px;font-family:inherit;font-weight:700}
.attendedOnBtn{border:1.5px solid var(--ok);background:var(--ok);color:#fff;font-size:11.5px;padding:5px 10px;
  border-radius:8px;font-family:inherit;font-weight:700}
.sumcard .n.att{color:var(--ok)}

.empty{text-align:center;padding:44px 20px;color:var(--ink-soft);font-size:13.5px;line-height:1.8}
.loading{text-align:center;padding:44px 20px;color:var(--ink-soft);font-size:13.5px}
</style>
</head>
<body>
<div class="hero">
  <div class="top">
    <div>
      <h1>🐻 櫃檯後台・創藝小玩家</h1>
      <div class="meta" id="lastUpdated">載入中…</div>
    </div>
    <button class="refreshBtn" id="btnRefresh">↻ 重新整理</button>
  </div>
  <div class="viewtabs">
    <button class="vtab on" id="vtBookings">📋 預約總覽</button>
    <button class="vtab" id="vtSchedule">🗓️ 課程日期管理</button>
  </div>
  <div class="datetabs" id="dateTabs"></div>
  <div class="searchrow" id="searchRow">
    <input id="searchBox" placeholder="搜尋姓名或電話…">
    <button class="togBtn" id="btnAllDates">看全部日期</button>
    <button class="togBtn" id="btnShowCancelled">顯示已取消</button>
  </div>
</div>

<div class="wrap" id="view"><div class="loading">載入預約資料中…</div></div>

<script>
/* 跟預約頁面同一份設定，資料庫網址、時段、品項上限都要保持一致 */
const FIREBASE_URL = "https://otto2-popup-2026-default-rtdb.asia-southeast1.firebasedatabase.app";
function buildDates(ranges){
  const out=[];
  ranges.forEach(([y,m,from,to])=>{
    for(let d=from;d<=to;d++) out.push(`${y}/${String(m).padStart(2,"0")}/${String(d).padStart(2,"0")}`);
  });
  return out;
}
const DEFAULT_DATES = buildDates([[2026,8,17,21],[2026,8,24,28]]);
let OPEN_DATES = DEFAULT_DATES.slice();      // 開放中的日期（保底清單＋後台新增，扣掉後台關閉的）
let SCHEDULE_RAW = {};                        // 後台目前每個日期的開關狀態（key 用 dash 格式）
const SLOTS = ["14:00-15:00","15:00-16:00","16:00-17:00","17:00-18:00","19:00-21:00"];
/* 保底清單（DEFAULT_DATES）預設只開放白天時段，晚上場要在後台個別勾選開放 */
const DEFAULT_SLOTS = ["14:00-15:00","15:00-16:00","16:00-17:00","17:00-18:00"];
const ITEMS = [
  { id:"clay",   name:"黏土",   icon:"🧸", cap:4, colorCls:"c-clay" },
  { id:"cream",  name:"奶油膠", icon:"🍦", cap:8, colorCls:"c-cream" },
  { id:"perler", name:"拼豆",   icon:"🔵", cap:8, colorCls:"c-perler" }
];
const itemOf=id=>ITEMS.find(i=>i.id===id);
const toKey=d=>d.replace(/\//g,"-");     // Firebase key 不能有斜線
const fromKey=k=>k.replace(/-/g,"/");

const pad=n=>String(n).padStart(2,"0");
const dstr=(y,m,d)=>`${y}/${pad(m)}/${pad(d)}`;
function weekdayOf(dateStr){
  const [y,m,d]=dateStr.split("/").map(Number);
  return ["日","一","二","三","四","五","六"][new Date(y,m-1,d).getDay()];
}
function todayStr(){
  const n=new Date(); return dstr(n.getFullYear(),n.getMonth()+1,n.getDate());
}
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── 狀態 ── */
let allBookings=[];       // {key, date, slot, adults, kids, items:[...], customer:{}, status, ts, ...}
let selDate = "";
let showAllDates=false;
let showCancelled=false;
let searchText="";
let viewMode="bookings";  // "bookings" | "schedule"

/* ── 資料讀取 ── */
/* SCHEDULE_RAW： { "2026/08/30": ["14:00-15:00","16:00-17:00"] }（陣列＝該日開放的時段）
   為了相容比較早期版本，值也可能是 true（＝全部時段開放）或 false（＝整天關閉）。 */
async function loadSchedule(){
  SCHEDULE_RAW={};
  if(FIREBASE_URL){
    try{
      const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupSchedule.json?_="+Date.now());
      if(!res.ok){
        console.warn("讀取 popupSchedule 失敗，HTTP "+res.status);
      }else{
        const raw=(await res.json())||{};
        Object.keys(raw).forEach(k=>{ SCHEDULE_RAW[fromKey(k)]=raw[k]; });
      }
    }catch(e){ SCHEDULE_RAW={}; }
  }
  recomputeOpenDates();
}
/* 這個日期實際開放的時段陣列 */
function effectiveSlots(date){
  if(Object.prototype.hasOwnProperty.call(SCHEDULE_RAW,date)){
    const v=SCHEDULE_RAW[date];
    if(v===true)return SLOTS.slice();
    if(v===false)return [];
    if(Array.isArray(v))return v.filter(s=>SLOTS.includes(s));
    return [];
  }
  return DEFAULT_DATES.includes(date)?DEFAULT_SLOTS.slice():[];
}
function recomputeOpenDates(){
  const set=new Set(DEFAULT_DATES.concat(Object.keys(SCHEDULE_RAW)));
  OPEN_DATES=Array.from(set).filter(d=>effectiveSlots(d).length>0).sort();
  if(!selDate||!OPEN_DATES.includes(selDate)) selDate = OPEN_DATES.includes(todayStr()) ? todayStr() : (OPEN_DATES[0]||"");
}
/* 把某天的開放時段整組寫回 Firebase；slotsArr 是要開放的時段字串陣列（[] 代表整天關閉） */
async function setDateSlots(dateStr,slotsArr){
  if(!FIREBASE_URL){ alert("尚未設定 FIREBASE_URL，無法寫入。"); return; }
  try{
    const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupSchedule/"+toKey(dateStr)+".json",{
      method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(slotsArr)
    });
    if(!res.ok){
      const t=await res.text().catch(()=> "");
      alert("寫入失敗（HTTP "+res.status+"）。\n很可能是 Firebase 規則沒有開放 popupSchedule 這個路徑的讀寫權限，請到 Realtime Database →「規則」分頁確認。\n"+t);
      return;
    }
  }catch(e){
    alert("更新失敗，請檢查網路連線後重試：\n"+e.message);
    return;
  }
  await loadSchedule(); renderSchedule();
}

/* ── 預約資料讀取／更新 ── */
async function loadAll(){
  try{
    const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupBookings.json?_="+Date.now());
    if(!res.ok){
      document.getElementById("lastUpdated").textContent="讀取失敗（HTTP "+res.status+"），請確認 Firebase 規則";
      return;
    }
    const j=await res.json();
    allBookings=j?Object.entries(j).map(([key,v])=>({key,...v})):[];
    document.getElementById("lastUpdated").textContent="最後更新："+new Date().toLocaleTimeString("zh-TW",{hour12:false});
  }catch(e){
    document.getElementById("lastUpdated").textContent="讀取失敗，請按「重新整理」再試一次";
  }
}
async function setStatus(key,status){
  try{
    const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupBookings/"+key+".json",{
      method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})
    });
    if(!res.ok){ alert("更新失敗（HTTP "+res.status+"），請確認 Firebase 規則。"); return; }
  }catch(e){ alert("更新失敗，請檢查網路後重試：\n"+e.message); return; }
  await loadAll(); render();
}
async function setAttended(key,attended){
  try{
    const res=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/popupBookings/"+key+".json",{
      method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({attended})
    });
    if(!res.ok){ alert("更新失敗（HTTP "+res.status+"），請確認 Firebase 規則。"); return; }
  }catch(e){ alert("更新失敗，請檢查網路後重試：\n"+e.message); return; }
  await loadAll(); render();
}

/* ── 篩選與統計 ── */
function visibleBookings(){
  return allBookings.filter(b=>{
    if(!showAllDates && b.date!==selDate)return false;
    if(!showCancelled && b.status==="cancelled")return false;
    if(searchText){
      const hay=((b.customer&&b.customer.name)||"")+((b.customer&&b.customer.phone)||"");
      if(!hay.includes(searchText))return false;
    }
    return true;
  });
}
/* 名額計算只看未取消的預約 */
function bookedOf(date,slot,itemId){
  return allBookings
    .filter(b=>b.date===date&&b.slot===slot&&b.status!=="cancelled"&&Array.isArray(b.items))
    .reduce((s,b)=>{
      const it=b.items.find(x=>x.itemId===itemId);
      return s+(it?(+it.qty||0):0);
    },0);
}

/* ── 畫面 ── */
function render(){
  renderDateTabs();
  document.getElementById("searchRow").style.display=viewMode==="bookings"?"flex":"none";
  if(viewMode==="schedule"){ renderSchedule(); return; }
  const v=document.getElementById("view");
  const list=visibleBookings();

  if(showAllDates){
    if(!list.length){ v.innerHTML=`<div class="empty">目前沒有符合條件的預約紀錄。</div>`; return; }
    const byDate={};
    list.forEach(b=>{ (byDate[b.date]=byDate[b.date]||[]).push(b); });
    const dates=Object.keys(byDate).sort();
    v.innerHTML=`<div class="sumrow">${sumCards(list)}</div>` +
      dates.map(d=>`<div class="slotsec"><h2>${d}（週${weekdayOf(d)}）<span class="cnt">共 ${byDate[d].length} 筆</span></h2>
        ${byDate[d].sort((a,b)=>a.slot.localeCompare(b.slot)).map(bookingRow).join("")}
      </div>`).join("");
  }else{
    const bySlot={};
    SLOTS.forEach(s=>bySlot[s]=[]);
    list.forEach(b=>{ if(bySlot[b.slot])bySlot[b.slot].push(b); });
    v.innerHTML=`<div class="sumrow">${sumCards(list)}</div>` +
      SLOTS.map(s=>{
        const rows=bySlot[s];
        return `<div class="slotsec">
          <h2>🕑 ${s}<span class="cnt">共 ${rows.length} 筆・${rows.reduce((n,b)=>n+(+b.people||0),0)} 位</span></h2>
          <div class="capbars">${ITEMS.map(it=>{
            const used=bookedOf(selDate,s,it.id), full=used>=it.cap;
            return `<div class="capbar ${it.colorCls}">
              <div class="nm">${it.icon} ${it.name}</div>
              <div class="val ${full?'full':'ok'}">${used} / ${it.cap}</div>
              <div class="bar"><i style="width:${Math.min(100,used/it.cap*100)}%"></i></div>
            </div>`;
          }).join("")}</div>
          ${rows.length?rows.map(bookingRow).join(""):`<div class="empty" style="padding:18px">這個時段目前沒有預約。</div>`}
        </div>`;
      }).join("");
  }

  v.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{
    if(confirm("確定要把這筆預約標記為取消嗎？取消後名額會釋放給其他人。"))setStatus(b.dataset.cancel,"cancelled");
  });
  v.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{
    setStatus(b.dataset.restore,"new");
  });
  v.querySelectorAll("[data-attend]").forEach(b=>b.onclick=()=>{
    setAttended(b.dataset.attend, b.dataset.cur!=="1");
  });
}
function sumCards(list){
  const active=list.filter(b=>b.status!=="cancelled");
  const people=active.reduce((s,b)=>s+(+b.people||0),0);
  const attended=active.filter(b=>b.attended).length;
  const perItem={};
  active.forEach(b=>(b.items||[]).forEach(it=>{perItem[it.itemId]=(perItem[it.itemId]||0)+(+it.qty||0)}));
  const cards=[`<div class="sumcard"><div class="n">${active.length}</div><div class="lb">筆預約</div></div>`,
    `<div class="sumcard"><div class="n">${people}</div><div class="lb">總人數</div></div>`,
    `<div class="sumcard"><div class="n att">${attended}／${active.length}</div><div class="lb">已報到</div></div>`];
  ITEMS.forEach(it=>cards.push(`<div class="sumcard"><div class="n">${perItem[it.id]||0}</div><div class="lb">${it.icon} ${it.name}</div></div>`));
  return cards.join("");
}
function bookingRow(b){
  const cancelled=b.status==="cancelled";
  const attended=!!b.attended;
  const itemsLine=(b.items||[]).map(it=>`${esc(it.person||'')}　${it.name}`).join("　｜　");
  const partyLine=`大人 ${b.adults||0} 位・兒童 ${b.kids||0} 位`;
  const phone=(b.customer&&b.customer.phone)||"";
  const name=(b.customer&&b.customer.name)||"（未填姓名）";
  const note=(b.customer&&b.customer.note)||"";
  const ts=b.ts?new Date(b.ts).toLocaleString("zh-TW",{hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
  const colorCls=(b.items&&b.items[0]&&itemOf(b.items[0].itemId)&&itemOf(b.items[0].itemId).colorCls)||"";
  return `<div class="bkrow ${colorCls} ${cancelled?'st-cancelled':''} ${attended?'st-attended':''}">
    <div class="bkhead">
      <div>
        <div class="bkname">${showAllDates?`${b.date}（週${weekdayOf(b.date)}）${b.slot}　`:''}${esc(name)}${phone?` <a href="tel:${phone}">${esc(phone)}</a>`:''}</div>
        <div class="bkparty">${partyLine}</div>
      </div>
      ${attended&&!cancelled?'<span class="badge-attended">✓ 已報到</span>':''}
      ${cancelled?'<span class="badge-cancel">已取消</span>':''}
    </div>
    <div class="bkitems">${itemsLine||"（無品項資料）"}</div>
    ${note?`<div class="bknote">備註：${esc(note)}</div>`:''}
    <div class="bkfoot">
      <span class="bkts">${ts}${b.key?'　編號 '+b.key.slice(-6).toUpperCase():''}</span>
      <span class="bkbtns">
        ${!cancelled?`<button class="${attended?'attendedOnBtn':'attendBtn'}" data-attend="${b.key}" data-cur="${attended?1:0}">${attended?'✓ 已報到':'標記報到'}</button>`:''}
        ${cancelled
          ? `<button class="restoreBtn" data-restore="${b.key}">還原</button>`
          : `<button class="cancelBtn" data-cancel="${b.key}">標記取消</button>`}
      </span>
    </div>
  </div>`;
}
function renderDateTabs(){
  const el=document.getElementById("dateTabs");
  if(viewMode!=="bookings"){ el.innerHTML=""; return; }
  el.innerHTML=OPEN_DATES.map(d=>`<button class="dtab ${!showAllDates&&d===selDate?'on':''}" data-d="${d}">
    <b>${+d.split("/")[2]}</b>週${weekdayOf(d)}</button>`).join("");
  el.querySelectorAll(".dtab").forEach(b=>b.onclick=()=>{
    selDate=b.dataset.d; showAllDates=false; syncToggleBtns(); render();
  });
}
function syncToggleBtns(){
  document.getElementById("btnAllDates").className="togBtn"+(showAllDates?" on":"");
  document.getElementById("btnAllDates").textContent=showAllDates?"只看單日":"看全部日期";
  document.getElementById("btnShowCancelled").className="togBtn"+(showCancelled?" on":"");
}

/* ── 課程日期管理 ── */
const SLOT_SHORT={"14:00-15:00":"14-15","15:00-16:00":"15-16","16:00-17:00":"16-17","17:00-18:00":"17-18","19:00-21:00":"19-21晚"};
function renderSchedule(){
  const today=todayStr();
  const all=Array.from(new Set(DEFAULT_DATES.concat(Object.keys(SCHEDULE_RAW)))).sort();
  const byMonth={};
  all.forEach(d=>{ const mk=d.slice(0,7); (byMonth[mk]=byMonth[mk]||[]).push(d); });
  const months=Object.keys(byMonth).sort();
  document.getElementById("view").innerHTML=`<div class="schedwrap">
    <div class="schedadd">
      <input type="date" id="newDateInput">
      <div class="schedaddslots">
        ${SLOTS.map((s,i)=>`<label class="slotchk"><input type="checkbox" class="newSlotChk" value="${s}" ${i<4?'checked':''}> ${SLOT_SHORT[s]}</label>`).join("")}
      </div>
      <button id="btnAddDate">＋ 新增／更新日期</button>
    </div>
    ${months.map(mk=>`<div class="schedmonth">${+mk.slice(5,7)} 月</div>
      ${byMonth[mk].map(d=>{
        const openSlots=effectiveSlots(d);
        const past=d<today;
        return `<div class="schedrow ${past?'past':''}">
          <div class="schedrowhead">
            <span class="d">${d}（週${weekdayOf(d)}）${past?'<small>已過期</small>':''}</span>
            <span class="schedcount">${openSlots.length?openSlots.length+' 個時段開放':'整天關閉'}</span>
          </div>
          <div class="schedslots">
            ${SLOTS.map(s=>{
              const on=openSlots.includes(s);
              return `<button class="slotToggle ${on?'on':''}" data-d="${d}" data-s="${s}">${SLOT_SHORT[s]}</button>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    `).join("")}
  </div>`;
  document.getElementById("btnAddDate").onclick=async()=>{
    const v=document.getElementById("newDateInput").value; // "2026-08-30"
    if(!v){ alert("請先選擇日期。"); return; }
    const checked=Array.from(document.querySelectorAll(".newSlotChk:checked")).map(c=>c.value);
    await setDateSlots(v.replace(/-/g,"/"), checked);
  };
  document.querySelectorAll(".slotToggle").forEach(b=>b.onclick=()=>{
    const d=b.dataset.d, s=b.dataset.s;
    const cur=effectiveSlots(d);
    const next=cur.includes(s) ? cur.filter(x=>x!==s) : SLOTS.filter(x=>cur.includes(x)||x===s);
    setDateSlots(d,next);
  });
}

/* ── 事件綁定 ── */
document.getElementById("btnRefresh").onclick=async()=>{
  if(viewMode==="schedule"){ await loadSchedule(); render(); }
  else{ await loadAll(); render(); }
};
document.getElementById("btnAllDates").onclick=()=>{ showAllDates=!showAllDates; syncToggleBtns(); render(); };
document.getElementById("btnShowCancelled").onclick=()=>{ showCancelled=!showCancelled; syncToggleBtns(); render(); };
document.getElementById("vtBookings").onclick=()=>{
  viewMode="bookings";
  document.getElementById("vtBookings").className="vtab on";
  document.getElementById("vtSchedule").className="vtab";
  render();
};
document.getElementById("vtSchedule").onclick=async()=>{
  viewMode="schedule";
  document.getElementById("vtSchedule").className="vtab on";
  document.getElementById("vtBookings").className="vtab";
  await loadSchedule(); render();
};
let searchDeb;
document.getElementById("searchBox").oninput=e=>{
  clearTimeout(searchDeb);
  searchDeb=setTimeout(()=>{ searchText=e.target.value.trim(); render(); },200);
};

/* 每 30 秒自動刷新一次，櫃檯開著螢幕不用一直手動按 */
(async function boot(){
  await loadSchedule();
  await loadAll();
  syncToggleBtns();
  render();
  setInterval(async()=>{
    if(viewMode==="schedule")await loadSchedule(); else await loadAll();
    render();
  },30000);
})();
</script>
</body>
</html>
